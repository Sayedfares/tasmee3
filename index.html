<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فارس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one dark ruled mushaf column between a top app bar and a bottom control dock. */
:root{
  color-scheme:dark;
  --bg:#151616; --bar:#1d1f1f; --surface:#242626; --surface2:#2e3131; --edge:#3a3d3d;
  --ink:#eeece4; --muted:#8e9391; --rule:#2a2c2c; --frame:#e8e4d8;
  --green:#55d98f; --green-deep:#1f8a52; --bad:#e2463c; --hint:#d9b24c; --skip:#e08a3a;
  --quran:"Amiri Quran",Amiri,serif; --ui:Tajawal,system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* top app bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:1px solid var(--edge);
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.ib{width:44px;height:44px;flex:none;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--surface)}
.ib:disabled{opacity:.4;cursor:default}
.info{flex:1;min-width:0;background:var(--surface);border:1px solid var(--edge);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:start}
.info .sn{font-family:var(--quran);font-size:20px;line-height:1.3}
.info .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* settings sheet */
.sheet{max-width:760px;margin:0 auto;background:var(--bar);border:1px solid var(--edge);border-top:0;border-radius:0 0 16px 16px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
select,input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--edge);border-radius:9px;padding:8px 10px;min-height:42px}
select{min-width:190px;max-width:100%}
input[type=number]{width:78px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;min-height:42px}
.btn{border:1px solid var(--edge);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green-deep);border-color:var(--green-deep);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:5px;margin-inline-end:6px;vertical-align:middle;filter:blur(1px)}
.tally{display:flex;gap:16px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink)}
.debug{display:flex;gap:8px}
.debug input{flex:1;min-width:0}
.credit{font-size:12px;color:var(--muted)}

/* mushaf */
.wrap{max-width:760px;margin:0 auto;padding-block:8px 190px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{padding-top:18px}
.pdiv{display:flex;align-items:center;gap:12px;margin:22px 0 4px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pdiv::before,.pdiv::after{content:"";flex:1;height:1px;background:var(--edge)}
.sura{position:relative;margin:6px 0 10px;border:2px solid var(--frame);outline:1px solid var(--frame);outline-offset:3px;border-radius:3px;padding:8px 56px;text-align:center;
  background:repeating-linear-gradient(45deg,transparent 0 7px,color-mix(in srgb,var(--frame) 9%,transparent) 7px 8px)}
.sura::before,.sura::after{content:"";position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border:2px solid var(--frame);border-radius:50%}
.sura::before{right:16px}.sura::after{left:16px}
.sura span{display:inline-block;min-width:55%;border:2px solid var(--frame);border-radius:999px;background:var(--bg);padding:2px 26px;font-family:var(--quran);font-size:26px;line-height:1.6}
.basmala{text-align:center;font-family:var(--quran);font-size:28px;line-height:2;margin-bottom:6px}
.pt{--lh:2.55em;font-family:var(--quran);font-size:27px;line-height:var(--lh);text-align:justify;text-align-last:center;
  background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px) var(--lh))}
.an{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.6em;padding:0 .12em;font-family:var(--ui);font-size:.5em;font-weight:700;line-height:1;color:var(--muted);border:1.5px solid var(--edge);border-radius:50%;vertical-align:middle;margin:0 .2em}
.empty{color:var(--muted);text-align:center;padding:70px 10px;line-height:1.9}

.w{padding:0 2px;border-radius:10px;cursor:pointer;transition:color .2s,background .2s,filter .2s;user-select:none;-webkit-user-select:none}
.w.ok{color:color-mix(in srgb,var(--green) 55%,var(--ink))}
.w.hint{color:var(--hint)}
.w.skip{color:var(--skip)}
.w.bad{color:var(--bad);background:radial-gradient(closest-side,color-mix(in srgb,var(--bad) 35%,transparent),transparent)}
.w.cur{box-shadow:inset 0 -2px 0 var(--green)}
/* memorization: unread words vanish, leaving only the ruled lines; mistakes become red blurred marks */
.mask .w:not(.ok):not(.hint):not(.skip){color:transparent}
.mask .w.bad{background:radial-gradient(closest-side,color-mix(in srgb,var(--bad) 85%,transparent),transparent);filter:blur(5px)}
.mask .w.skip{color:transparent;background:radial-gradient(closest-side,color-mix(in srgb,var(--skip) 80%,transparent),transparent);filter:blur(5px)}
.mask .w.bad.peek{color:var(--bad);filter:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--bad) 30%,transparent),transparent)}
.mask .w.bad.open{animation:throb 1.6s ease-in-out infinite}
@keyframes throb{50%{opacity:.55}}

.errors{margin-top:30px;border-top:1px solid var(--edge);padding-top:14px}
.errors h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:500}
.errors ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.errors li{background:var(--surface);border:1px solid var(--edge);border-radius:10px;padding:6px 12px;font-size:14px;cursor:pointer}
.errors li .q{font-family:var(--quran);font-size:19px;color:var(--bad)}

/* toast */
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));z-index:25;width:min(560px,calc(100% - 32px));pointer-events:none}
.msg{background:var(--surface2);border:1px solid var(--edge);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:auto}
.msg.warn{border-color:var(--bad);color:#ffd9d5}

/* bottom dock */
.dock{position:fixed;inset:auto 0 0 0;z-index:20;background:linear-gradient(to top,var(--bar) 70%,color-mix(in srgb,var(--bar) 0%,transparent));
  padding-top:22px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:14px}
.mic{width:76px;height:76px;flex:none;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 50% 35%,#6fe7a3,var(--green) 55%,#3fbf76);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent),0 0 28px color-mix(in srgb,var(--green) 55%,transparent)}
.mic:disabled{opacity:.45;cursor:default}
.mic.on{animation:ring 1.5s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent),0 0 28px color-mix(in srgb,var(--green) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent,0 0 28px color-mix(in srgb,var(--green) 55%,transparent)}}
.tools{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chips{display:flex;gap:8px;align-items:center;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--edge);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad)}
.heard{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:260px}
.row{display:flex;gap:8px}
.tb{width:48px;height:48px;border-radius:50%;border:1px solid var(--edge);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.tb:hover{border-color:var(--green)}
.tb:disabled{opacity:.4;cursor:default}
.tb[aria-pressed=true]{background:var(--green-deep);border-color:var(--green-deep);color:#fff}
@media (max-width:480px){.pt{font-size:23px}.sura span{font-size:22px;min-width:0}.sura{padding:8px 46px}.basmala{font-size:24px}.tb{width:44px;height:44px}.mic{width:68px;height:68px}.heard{max-width:150px}}
@media (prefers-reduced-motion:reduce){.mic.on,.mask .w.bad.open{animation:none}.w{transition:none}}
</style>

<div dir="rtl" lang="ar">
<header class="top">
  <div class="in">
    <button class="ib" id="menuBtn" aria-label="الإعدادات واختيار السورة" aria-expanded="false">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="info" id="infoBox" aria-label="اختيار السورة">
      <span class="sn" id="infoSurah">فارس</span>
      <span class="meta" id="infoMeta">اقرأ وهو يتابعك</span>
    </button>
    <button class="ib" id="autoBtn" aria-label="اكتشاف تلقائي للسورة" title="اكتشاف تلقائي" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </div>
</header>

<div class="sheet" id="sheet" hidden>
  <div class="controls">
    <label class="field">السورة<select id="surah"><option>جارِ التحميل…</option></select></label>
    <label class="field">من آية<input id="from" type="number" min="1" value="1"></label>
    <label class="field">إلى آية<input id="to" type="number" min="1" value="7"></label>
    <button class="btn primary" id="load">افتح السورة</button>
  </div>
  <label class="chk"><input id="beep" type="checkbox" checked> تنبيه صوتي عند الخطأ</label>
  <div class="legend">
    <span><i style="background:var(--bad)"></i>خطأ — أعد الكلمة لتكمل (اضغط العلامة لترى الكلمة)</span>
    <span><i style="background:var(--hint)"></i>تلميح</span>
    <span><i style="background:var(--green)"></i>الكلمة الحالية</span>
  </div>
  <div class="tally"><span>صحيح <b id="cOk">0</b></span><span>أخطاء <b id="cBad">0</b></span><span>تلميحات <b id="cHint">0</b></span></div>
  <div class="debug" id="debug" hidden>
    <input id="debugText" type="text" placeholder="اكتب ما قرأته هنا (للتجربة بدون مايك)">
    <button class="btn" id="debugSend">إرسال</button>
  </div>
  <div class="credit">نص القرآن الكريم من مشروع تنزيل — tanzil.net</div>
</div>

<main class="wrap">
  <div class="mushaf" id="mushaf"><div class="empty">جارِ التحميل…</div></div>
  <section class="errors" id="errors" hidden><h2>مواضع الأخطاء</h2><ul id="errList"></ul></section>
</main>

<div id="msg" role="status" aria-live="polite"></div>

<footer class="dock">
  <div class="in">
    <button class="mic" id="mic" aria-label="ابدأ التسميع" disabled>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
    </button>
    <div class="tools">
      <div class="chips">
        <span class="heard chip" id="heard">اضغط المايك وابدأ القراءة</span>
        <span class="chip" title="عدد الأخطاء"><span class="dot"></span><span id="cBadChip">٠</span></span>
      </div>
      <div class="row">
        <button class="tb" id="modeBtn" aria-pressed="false" aria-label="وضع الحفظ (إخفاء الآيات)" title="وضع الحفظ">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7c2 0 3.7.6 5.1 1.5M22 12s-3.5 7-10 7c-2 0-3.7-.6-5.1-1.5"/><circle cx="12" cy="12" r="3"/><path d="M3 21 21 3"/></svg>
        </button>
        <button class="tb" id="hintBtn" aria-label="تلميح: أظهر الكلمة التالية" title="الكلمة التالية" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <button class="tb" id="ayahBtn" aria-label="أظهر باقي الآية" title="باقي الآية" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 6-6 6 6 6M18 6l-6 6 6 6"/></svg>
        </button>
        <button class="tb" id="resetBtn" aria-label="ابدأ من جديد" title="إعادة" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};

/* ---------- Arabic normalization & matching ---------- */
const DIAC = /[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
function norm(w){
  return (w||'').replace(DIAC,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'')
    .replace(/[^ء-ي]/g,'');
}
const tokenize = t => (t||'').split(/\s+/).map(norm).filter(Boolean);
const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

function lev(a,b){
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[b.length];
}
const matchMemo=new Map();
function match(s,e){
  if(!s||!e) return false;
  if(s===e) return true;
  const min=Math.min(s.length,e.length), max=Math.max(s.length,e.length);
  if(min<=2) return false;                       // short words must be exact
  const need = min<=4 ? 0.75 : 0.7;
  if(1-(max-min)/max < need) return false;       // lengths too different
  const key=s+'|'+e;
  let r=matchMemo.get(key);
  if(r===undefined){
    r = 1 - lev(s,e)/max >= need;
    if(matchMemo.size>200000) matchMemo.clear();
    matchMemo.set(key, r);
  }
  return r;
}

/* ---------- State ---------- */
let words=[];          // {text, n, ayah, el}
let committed={pos:0, marks:[]};   // marks[i] = {s:'ok'|'bad'|'skip'|'hint', said?}
let pending=[];        // unresolved spoken words carried between final results
let listening=false, rec=null, finalUpTo=0, mode='read', lastScroll=-1;
let surahs=[];

/* Align spoken (normalized) words against expected text starting at st.pos.
   Strict: any word other than the expected one is a mistake. The expected word is
   then marked "open" (red, still hidden in memorization mode) and reading cannot
   move on until that word itself is said. st.wrong counts every wrong word heard.
   final=false (live, unsettled text) waits for a following word before calling a
   mistake. Returns the spoken words that could not be resolved yet. */
function align(st, spoken, final){
  let i=0;
  while(i<spoken.length && st.pos<words.length){
    const s=spoken[i], j=st.pos, m=st.marks[j], open=!!(m && m.open);
    const done = open ? {s:'bad', said:m.said} : {s:'ok'};
    if(match(s, words[j].n)){ st.marks[j]=done; st.pos++; i++; continue; }
    if(j+1<words.length && match(s, words[j].n+words[j+1].n)){
      st.marks[j]=done; st.marks[j+1]={s:'ok'}; st.pos+=2; i++; continue;
    }
    if(j>0 && match(s, words[j-1].n)){ i++; continue; }      // repeated previous word
    if(!final && spoken[i+1]===undefined) break;             // live text may still change
    st.marks[j]={s:'bad', said:s, open:true};
    st.wrong=(st.wrong||0)+1; i++;
  }
  return spoken.slice(i);
}

function countErrors(st){ return st.marks.filter(m=>m && m.s==='bad').length; }

/* Words said before the expected text starts (isti'adha, basmala) are not mistakes. */
function stripOpening(toks, st){
  const p=st.pos;
  if(p>0 && st.marks[p-1]) return toks;                      // mid-recitation
  toks=stripPrefix(toks, ISTIADHA);
  return words[p] && words[p].n==='بسم' ? toks : stripPrefix(toks, BASMALA);
}

/* After locking on from a live (unsettled) phrase, that phrase's words were already
   used; the same words arrive again when it settles, so skip them once. */
let dropNext=0, lastDetKey='';

function commitSpoken(text){
  const toks=tokenize(text).slice(dropNext); dropNext=0;
  if(detecting){ detectFeed(toks, true); return; }
  commitTokens(toks);
}
function commitTokens(toks){
  const before=committed.wrong||0, pos0=committed.pos;
  pending = align(committed, stripOpening(pending.concat(toks), committed), true);
  if((committed.wrong||0)>before) alertError();
  // lost track? the reader may have moved to another place
  if(!autoMode) return;
  lostBuf = committed.pos===pos0 ? lostBuf.concat(toks).slice(-12) : [];
  if(lostBuf.length>=6){
    const hit=locate(lostBuf.slice(-10), 5);
    if(hit){
      const here=words[Math.min(committed.pos, words.length-1)];
      if(!(flat.s[hit.i]===curSurah && here && Math.abs(flat.a[hit.i]-here.ayah)<=1)) lockOn(hit.i, hit.q);
    }
  }
}

function preview(interim){
  const toks=tokenize(interim).slice(dropNext);
  if(detecting){
    const key=toks.join(' ');
    if(toks.length && key!==lastDetKey){ lastDetKey=key; detectFeed(toks, false); }
    return;
  }
  const st={pos:committed.pos, marks:committed.marks.slice()};
  if(toks.length) align(st, stripOpening(pending.concat(toks), st), false);
  render(st);
}

/* ---------- Auto-detect: find what is being recited anywhere in the Quran ---------- */
let flat=null;                 // every word of the Quran: normalized text, surah, ayah, index in ayah
let detecting=false, autoMode=false, detBuf=[], lostBuf=[], curSurah=0;

function ayahTokens(sn, an, text){
  let toks=text.split(/\s+/).filter(x=>norm(x));
  if(sn!==1 && an===1 && toks.slice(0,4).map(norm).join(' ')==='بسم الله الرحمن الرحيم') toks=toks.slice(4);
  return toks;
}
function buildFlat(){
  flat={n:[], s:[], a:[], w:[], idx:new Map(), cache:new Map()};
  surahs.forEach(s=>s.ayahs.forEach((text,ai)=>{
    ayahTokens(s.number, ai+1, text).forEach((tx,wi)=>{
      const n=norm(tx), p=flat.n.length;
      flat.n.push(n); flat.s.push(s.number); flat.a.push(ai+1); flat.w.push(wi);
      if(!flat.idx.has(n)) flat.idx.set(n, []);
      flat.idx.get(n).push(p);
    });
  }));
}
/* Every position whose word matches spoken word w (searches distinct words, then expands). */
function positionsOf(w){
  if(flat.cache.has(w)) return flat.cache.get(w);
  const out=[];
  for(const [v, ps] of flat.idx) if(match(w, v)) for(const p of ps) out.push(p);
  if(flat.cache.size>300) flat.cache.clear();
  flat.cache.set(w, out);
  return out;
}

const ISTIADHA=['اعوذ','بالله','من','الشيطان','الرجيم'], BASMALA=['بسم','الله','الرحمن','الرحيم'];
function stripPrefix(q, seq){
  let k=0; while(k<q.length && k<seq.length && match(q[k], seq[k])) k++;
  return (k>=2 || k===q.length) ? q.slice(k) : q;
}

/* Tolerant walk of spoken words q against the Quran from word i; returns how many line up. */
function scoreAt(q, i){
  const N=flat.n; let j=i, sc=0;
  for(let t=0; t<q.length && j<N.length; t++){
    if(match(q[t], N[j])){ sc++; j++; }
    else if(j+1<N.length && match(q[t], N[j+1])){ sc++; j+=2; }          // a word was skipped
    else if(t+1<q.length && match(q[t+1], N[j])){ }                       // extra noise word
    else j++;                                                             // wrong word
  }
  return sc;
}

/* Best place in the Quran for spoken words q, if it is clear enough. */
function locate(q, minScore){
  const k=q.length; if(k<3 || !flat) return null;
  const starts=new Set(positionsOf(q[0]));
  for(const p of positionsOf(q[1])) if(p>0) starts.add(p-1);
  const cands=[];
  for(const i of starts) cands.push({i, sc:scoreAt(q,i)});
  if(!cands.length) return null;
  let best=cands[0]; cands.forEach(c=>{ if(c.sc>best.sc) best=c; });
  let second=0; cands.forEach(c=>{ if(Math.abs(c.i-best.i)>k && c.sc>second) second=c.sc; });
  if(best.sc < Math.max(minScore||3, Math.ceil(0.6*k)) || best.sc<=second) return null;
  return {i:best.i, q};
}

function detectFeed(toks, isFinal){
  const all=detBuf.concat(toks);
  if(isFinal) detBuf=all.slice(-20);
  let q=stripPrefix(stripPrefix(all, ISTIADHA), BASMALA);
  if(q.length>15) q=q.slice(-12);
  const hit=locate(q);
  if(hit){ if(!isFinal) dropNext=toks.length; lockOn(hit.i, hit.q); }
}

function startDetect(){
  detecting=true; autoMode=true; detBuf=[]; lostBuf=[]; pending=[]; dropNext=0;
  words=[]; committed={pos:0, marks:[]}; curSurah=0;
  $('#mushaf').innerHTML='<div class="empty">اقرأ من أي مكان في القرآن…<br>هيتعرّف على السورة والآية تلقائيًا</div>';
  showMsg(''); updateStats(); updateInfo(committed);
}

function lockOn(i, q){
  detecting=false; detBuf=[]; lostBuf=[];
  const sn=flat.s[i], an=flat.a[i];
  renderSurah(sn, an, surahs[sn-1].numberOfAyahs);
  jumpTo(flat.w[i]);
  commitTokens(q);
  render(committed);
  showMsg(`تم التعرّف: ${surahs[sn-1].name} — من الآية ${toAr(an)}`);
}

/* ---------- Rendering ---------- */
function render(st){
  for(let i=0;i<words.length;i++){
    const m=st.marks[i], el=words[i].el;
    let c='w'+(m?' '+m.s:'')+(m&&m.open?' open':'')+(m&&m.s==='bad'&&peek.has(i)?' peek':'')+(i===st.pos?' cur':'');
    if(el.className!==c) el.className=c;
    el.title = m && m.s==='bad' ? 'سُمع: '+m.said : '';
  }
  updateInfo(st);
  if(st.pos!==lastScroll && words[st.pos]){
    lastScroll=st.pos;
    const r=words[st.pos].el.getBoundingClientRect();
    if(r.top<80 || r.bottom>innerHeight-120) words[st.pos].el.scrollIntoView({behavior:'smooth',block:'center'});
  }
  updateStats();
  if(st===committed || st.pos>=words.length) checkDone(st);
}

function updateStats(){
  const c={ok:0,bad:0,hint:0};
  committed.marks.forEach(m=>{ if(m) c[m.s]++; });
  $('#cOk').textContent=c.ok; $('#cBad').textContent=c.bad; $('#cHint').textContent=c.hint;
  $('#cBadChip').textContent=toAr(c.bad);
  const errs=[];
  committed.marks.forEach((m,i)=>{ if(m && m.s==='bad') errs.push(i); });
  $('#errors').hidden=!errs.length;
  $('#errList').innerHTML='';
  errs.forEach(i=>{
    const li=document.createElement('li');
    const m=committed.marks[i];
    li.innerHTML=`<span class="q"></span> — آية ${toAr(words[i].ayah)}`;
    li.querySelector('.q').textContent = m.open ? '…' : words[i].text;   // don't give away the word being retried
    if(m.s==='bad') li.title='سُمع: '+m.said;
    li.onclick=()=>words[i].el.scrollIntoView({behavior:'smooth',block:'center'});
    $('#errList').appendChild(li);
  });
}

let doneShown=false;
function checkDone(st){
  if(!words.length || st.pos<words.length || doneShown || st!==committed) return;
  doneShown=true;
  const errs=countErrors(committed), total=words.length;
  const text = errs ? `انتهيت ✔ — ${toAr(errs)} خطأ من ${toAr(total)} كلمة. راجع المواضع الملوّنة.` : `ما شاء الله! ${toAr(total)} كلمة بدون أخطاء.`;
  if(autoMode && listening){
    // keep listening: whatever is recited next gets detected again
    detecting=true; detBuf=[]; lostBuf=[]; pending=[];
    showMsg(text+' كمّل قراءة من أي مكان وهيتعرّف عليها.');
    return;
  }
  stopListening();
  showMsg(text);
}

let msgTimer=null;
function showMsg(t, warn){
  clearTimeout(msgTimer);
  $('#msg').innerHTML = t ? `<div class="msg${warn?' warn':''}"></div>` : '';
  if(!t) return;
  $('#msg .msg').textContent=t;
  $('#msg .msg').onclick=()=>showMsg('');
  if(!warn) msgTimer=setTimeout(()=>showMsg(''), 6000);
}

/* ---------- Error feedback ---------- */
let actx=null;
function alertError(){
  try{ navigator.vibrate && navigator.vibrate(120); }catch{}
  if(!$('#beep').checked) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    // buzzer: two short, harsh low pulses (two slightly detuned square waves)
    const t0=actx.currentTime, g=actx.createGain();
    g.connect(actx.destination);
    g.gain.setValueAtTime(0, t0);
    [0, 0.24].forEach(at=>{
      g.gain.setValueAtTime(0.12, t0+at);
      g.gain.setValueAtTime(0.12, t0+at+0.17);
      g.gain.linearRampToValueAtTime(0, t0+at+0.19);
    });
    [110, 116].forEach(f=>{
      const o=actx.createOscillator();
      o.type='square'; o.frequency.value=f;
      o.connect(g); o.start(t0); o.stop(t0+0.45);
    });
  }catch{}
}

/* ---------- Loading Quran text (bundled quran.json) ---------- */
async function init(){
  try{
    const r=await fetch('quran.json');
    if(!r.ok) throw new Error(r.status);
    surahs=(await r.json()).map(s=>({...s, numberOfAyahs:s.ayahs.length}));
    const sel=$('#surah'); sel.innerHTML='';
    surahs.forEach(s=>{
      const o=document.createElement('option');
      o.value=s.number; o.textContent=`${toAr(s.number)}. ${s.name.replace(/^سُورَةُ\s*/,'')} (${toAr(s.numberOfAyahs)})`;
      sel.appendChild(o);
    });
    const saved=store.get('q_sel');
    if(saved){ sel.value=saved.s; $('#from').value=saved.f; $('#to').value=saved.t; setMode(saved.m||'read'); }
    else onSurahChange();
    buildFlat();
    $('#mic').disabled=false; $('#autoBtn').disabled=false;
    $('#mushaf').innerHTML='<div class="empty">دوس المايك الأخضر واقرأ من أي مكان<br>هيتعرّف على السورة والآية لوحده<br><br>أو اختار سورة من القائمة ☰</div>';
  }catch(e){
    showMsg('تعذّر تحميل نص القرآن — أعد تحميل الصفحة.', true);
  }
}

function onSurahChange(){
  const s=surahs[$('#surah').value-1]; if(!s) return;
  $('#from').value=1; $('#to').value=s.numberOfAyahs;
  $('#from').max=$('#to').max=s.numberOfAyahs;
}

function loadSelection(){
  stopListening();
  autoMode=false; detecting=false; dropNext=0;
  const n=+$('#surah').value, s=surahs[n-1]; if(!s) return;
  let f=Math.max(1, +$('#from').value||1), t=Math.min(s.numberOfAyahs, +$('#to').value||s.numberOfAyahs);
  if(t<f) t=f;
  store.set('q_sel',{s:n,f,t,m:mode});
  renderSurah(n, f, t);
}

function renderSurah(n, f, t){
  const s=surahs[n-1];
  curSurah=n;
  $('#surah').value=n; $('#from').value=f; $('#to').value=t;
  $('#from').max=$('#to').max=s.numberOfAyahs;
  const box=$('#mushaf');
  box.innerHTML=''; words=[]; peek.clear();
  // Laid out on the pages of the Madani mushaf: a page always ends at the end of an ayah.
  const frag=document.createDocumentFragment();
  let body=null, pageNo=0;
  for(let ai=f-1; ai<t; ai++){
    const an=ai+1;
    if(s.pages[ai]!==pageNo){
      pageNo=s.pages[ai];
      const pg=document.createElement('section'); pg.className='page';
      if(body){ const d=document.createElement('div'); d.className='pdiv'; d.textContent='صفحة '+toAr(pageNo); pg.appendChild(d); }
      if(an===1){
        const b=document.createElement('div'); b.className='sura';
        const bn=document.createElement('span'); bn.textContent=s.name; b.appendChild(bn); pg.appendChild(b);
        if(n!==1 && n!==9){
          const bs=document.createElement('div'); bs.className='basmala';
          bs.textContent='بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ'; pg.appendChild(bs);
        }
      }
      body=document.createElement('div'); body.className='pt'; pg.appendChild(body);
      frag.appendChild(pg);
    }
    ayahTokens(n, an, s.ayahs[ai]).forEach(tx=>{
      const el=document.createElement('span');
      el.className='w'; el.textContent=tx;
      const idx=words.length;
      el.onclick=()=>wordClick(idx);
      words.push({text:tx, n:norm(tx), ayah:an, page:pageNo, juz:s.juz[ai], el});
      body.append(el, ' ');
    });
    const mk=document.createElement('span'); mk.className='an'; mk.textContent=toAr(an);
    mk.setAttribute('aria-label','آية '+toAr(an));
    body.append(mk, ' ');
  }
  box.appendChild(frag);
  reset();
  ['#mic','#hintBtn','#ayahBtn','#resetBtn'].forEach(id=>$(id).disabled=false);
}

/* In memorization mode a mistake is a red blurred mark; tapping it shows the word. */
const peek=new Set();
function wordClick(i){
  const m=committed.marks[i];
  if(mode==='hide' && m && m.s==='bad'){ peek.has(i) ? peek.delete(i) : peek.add(i); render(committed); return; }
  jumpTo(i);
}

/* Reveal the rest of the current ayah and move to the next one. */
function revealAyah(){
  if(committed.pos>=words.length) return;
  const a=words[committed.pos].ayah;
  while(committed.pos<words.length && words[committed.pos].ayah===a){
    const m=committed.marks[committed.pos];
    committed.marks[committed.pos] = m && m.open ? {s:'bad', said:m.said} : {s:'hint'};
    committed.pos++;
  }
  pending=[]; render(committed);
}

function updateInfo(st){
  if(!words.length){ $('#infoSurah').textContent='فارس'; $('#infoMeta').textContent=detecting?'جارِ الاستماع… اقرأ من أي مكان':'اقرأ وهو يتابعك'; return; }
  const w=words[Math.min(st.pos, words.length-1)];
  $('#infoSurah').textContent=surahs[curSurah-1].name;
  $('#infoMeta').textContent=`صفحة ${toAr(w.page)} | جزء ${toAr(w.juz)} | آية ${toAr(w.ayah)}`;
}

function reset(){
  committed={pos:0, marks:[]}; pending=[]; lostBuf=[]; doneShown=false; lastScroll=-1;
  showMsg(''); if(!listening) $('#heard').textContent='اضغط المايك وابدأ القراءة';
  render(committed);
}

function jumpTo(i){
  committed.pos=i; pending=[]; doneShown=false;
  for(let k=i;k<words.length;k++) committed.marks[k]=undefined;
  render(committed);
}

function hint(){
  if(committed.pos>=words.length) return;
  const m=committed.marks[committed.pos];
  committed.marks[committed.pos] = m && m.open ? {s:'bad', said:m.said} : {s:'hint'};
  committed.pos++; pending=[];
  render(committed);
}

function setMode(m){
  mode=m;
  $('#modeBtn').setAttribute('aria-pressed', m==='hide');
  $('#mushaf').classList.toggle('mask', m==='hide');
  if(m!=='hide' && peek.size){ peek.clear(); render(committed); }
  const s=store.get('q_sel'); if(s){ s.m=m; store.set('q_sel',s); }
}

/* ---------- Speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function startRec(){
  rec=new SR();
  rec.lang='ar-SA'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  finalUpTo=0;
  rec.onresult=e=>{
    let finals='', interim='';
    for(let r=e.resultIndex; r<e.results.length; r++){
      const res=e.results[r];
      if(res.isFinal){ if(r>=finalUpTo){ finals+=' '+res[0].transcript; finalUpTo=r+1; } }
      else interim+=' '+res[0].transcript;
    }
    if(finals.trim()) commitSpoken(finals);
    preview(interim);
    const shown=(interim||finals).trim();
    if(shown) $('#heard').textContent='🎧 '+shown;
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){
      listening=false; updateMic();
      showMsg('لم يُسمح باستخدام المايك. اسمح بالوصول للمايك من إعدادات المتصفح.', true);
    } else if(e.error==='network'){
      listening=false; updateMic();
      showMsg('التعرّف على الصوت يحتاج إنترنت. تأكد من الاتصال.', true);
    }
  };
  rec.onend=()=>{ if(listening){ try{ startRec(); }catch{ listening=false; updateMic(); } } };
  rec.start();
}

/* Claude dictation (when hosted on claude.ai), with the browser's own recognizer as fallback */
let dict=null;
const heard = t => { if(t) $('#heard').textContent='🎧 '+t; };
const DICT_ERR = {
  not_granted:'لم يُسمح باستخدام المايك. اسمح به من قائمة الأذونات (Permissions) أعلى الصفحة.',
  rate_limited:'ضغط كبير على خدمة الصوت — حاول بعد لحظات.',
  upstream_error:'حصلت مشكلة في المايك أو خدمة الصوت — حاول تاني.'
};
function dictFailed(code){
  listening=false; updateMic();
  if(code==='unavailable'){
    dict=null;
    showMsg(SR ? 'خدمة الإملاء العربي مش متاحة هنا — اضغط المايك تاني لاستخدام التعرف على الصوت من المتصفح.' : 'التعرف على الصوت بالعربي مش متاح في المتصفح ده. استخدم Chrome أو Edge.', true);
  } else if(DICT_ERR[code]) showMsg(DICT_ERR[code], true);
}
if(window.claude && claude.use){
  claude.use('dictation').then(d=>{
    if(!d) return;
    dict=d;
    d.onPartial(({text})=>{ preview(text); heard(text); });
    d.onFinal(({text})=>{ commitSpoken(text); preview(''); heard(text); });
    d.onState(({state,reason})=>{
      if(state==='idle' && listening){ if(reason==='stopped'||reason==='viewer_stopped'||reason==='hidden'){ listening=false; updateMic(); } else dictFailed(reason); }
    });
  }).catch(()=>{});
}

/* Android app (Capacitor): native speech recognizer. Each recognizer session
   streams cumulative partials; the last one is committed when the session ends,
   then a new session starts while the user is still reciting. */
const NSR = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
  && window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition;
let nSession='', nTimer=null, nFails=0;
if(NSR){
  NSR.addListener('partialResults', d=>{
    const t=d && d.matches && d.matches[0];
    if(t){ nSession=t; nFails=0; preview(t); heard(t); }
  });
  NSR.addListener('listeningState', d=>{
    if(d.status!=='stopped') return;
    clearTimeout(nTimer);
    nTimer=setTimeout(()=>{            // give the final result a moment to arrive
      if(nSession){ commitSpoken(nSession); nSession=''; render(committed); }
      if(listening) setTimeout(nativeStart, 150);
    }, 500);
  });
}
function nativeStart(){
  if(!listening) return;
  nSession='';
  NSR.start({language:'ar-SA', partialResults:true, popup:false, maxResults:1}).catch(err=>{
    const m=String(err && err.message || err);
    if(/permission/i.test(m)){ listening=false; updateMic(); showMsg('لازم تسمح للتطبيق باستخدام المايك من إعدادات الموبايل.', true); return; }
    if(++nFails>8){ listening=false; updateMic(); showMsg('التعرف على الصوت وقف — دوس المايك تاني.', true); }
  });
}
async function startNative(){
  listening=true; updateMic(); showMsg('');
  try{
    const av=await NSR.available();
    if(!av.available){ listening=false; updateMic(); showMsg('الموبايل ده مفيهوش خدمة تعرف على الصوت. ثبّت أو حدّث تطبيق Google.', true); return; }
    let p=await NSR.checkPermissions();
    if(p.speechRecognition!=='granted') p=await NSR.requestPermissions();
    if(p.speechRecognition!=='granted'){ listening=false; updateMic(); showMsg('لازم تسمح للتطبيق باستخدام المايك عشان التسميع يشتغل.', true); return; }
  }catch(e){}
  nFails=0; nativeStart();
}

function startListening(){
  if(!words.length || detecting) startDetect();
  else if(committed.pos>=words.length) reset();
  doneShown=false;
  if(NSR){ startNative(); return; }
  if(dict){
    listening=true; updateMic(); showMsg('');
    dict.start({language:'ar'}).catch(e=>{ if(e && e.code!=='stopped') dictFailed(e.code); });
    return;
  }
  if(window.claude){ showMsg('المايك مش متاح في النسخة دي على claude.ai — افتح نسخة الموقع المستقلة من البرنامج.', true); return; }
  if(!SR){ showMsg('المتصفح ده مش بيدعم التعرف على الصوت. استخدم Google Chrome أو Microsoft Edge.', true); return; }
  listening=true; updateMic();
  try{ startRec(); }catch{ listening=false; updateMic(); }
}
function stopListening(){
  listening=false;
  if(NSR){ clearTimeout(nTimer); NSR.stop().catch(()=>{}); if(nSession){ commitSpoken(nSession); nSession=''; } }
  if(dict && dict.active()) dict.stop().catch(()=>{});
  if(rec){ try{ rec.stop(); }catch{} rec=null; }
  updateMic(); render(committed);
}
function updateMic(){
  $('#mic').classList.toggle('on', listening);
  $('#mic').setAttribute('aria-label', listening?'إيقاف':'ابدأ التسميع');
  if(listening && !$('#heard').textContent.startsWith('🎧')) $('#heard').textContent='🎧 أسمعك…';
  if(!listening && $('#heard').textContent.startsWith('🎧')) $('#heard').textContent='متوقف — اضغط المايك للمتابعة';
  updateInfo(committed);
}

/* ---------- Wiring ---------- */
$('#surah').onchange=onSurahChange;
function toggleSheet(open){
  const sh=$('#sheet'); open = open===undefined ? sh.hidden : open;
  sh.hidden=!open; $('#menuBtn').setAttribute('aria-expanded', open);
}
$('#menuBtn').onclick=()=>toggleSheet();
$('#infoBox').onclick=()=>toggleSheet();
$('#load').onclick=()=>{ loadSelection(); toggleSheet(false); };
$('#autoBtn').onclick=()=>{ toggleSheet(false); stopListening(); startDetect(); startListening(); };
$('#modeBtn').onclick=()=>setMode(mode==='hide' ? 'read' : 'hide');
$('#mic').onclick=()=> listening ? stopListening() : startListening();
$('#hintBtn').onclick=hint;
$('#ayahBtn').onclick=revealAyah;
$('#resetBtn').onclick=()=>{ stopListening(); reset(); };
if((!SR && !NSR) || /debug/.test(location.search)){
  $('#debug').hidden=false;
  const send=()=>{ commitSpoken($('#debugText').value); render(committed); $('#heard').textContent='⌨ '+$('#debugText').value; $('#debugText').value=''; };
  $('#debugSend').onclick=send;
  $('#debugText').onkeydown=e=>{ if(e.key==='Enter') send(); };
}
init();
</script>
